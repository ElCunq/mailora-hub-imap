services:
  mailora-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailora-hub
    restart: unless-stopped
    ports:
      - "3030:3030"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:///data/mailora_v3.db
      - RUST_LOG=info,mailora_hub_imap=debug
      - MAILORA_ENV=production
      - MAILCOW_URL
      - MAILCOW_API_KEY
